<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бій суперників</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Бій суперників</h1>

    <div class="fighter">
      <h2 id="name1"></h2>
      <div class="bar"><div class="fill" id="fill1"></div></div>
      <div class="label" id="label1"></div>
    </div>

    <div class="fighter">
      <h2 id="name2"></h2>
      <div class="bar"><div class="fill" id="fill2"></div></div>
      <div class="label" id="label2"></div>
    </div>

    <div class="btns">
      <button id="fightBtn">Бій (обидва втрачають бали)</button>
      <button id="strikeBtn">Підступний удар (бʼє лише суперника)</button>
      <button id="resetBtn">Почати заново</button>
    </div>

    <div id="log">Натисніть кнопку, щоб почати бій.</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
